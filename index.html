<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English B2 Path</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <div class="top-stats" id="topStats"></div>
  <a class="icon-btn" id="authBadge" href="#/account" title="Войти в аккаунт" style="text-decoration:none">👤</a>
  <button class="icon-btn" id="themeBtn" title="Тема">🌓</button>
</header>
<div class="layout">
  <nav class="side" id="side">
    <a href="#/today" data-r="today">📅 Сегодня</a>
    <a href="#/map" data-r="map">🗺️ Карта курса</a>
    <a href="#/grammar" data-r="grammar">📘 Уроки</a>
    <a href="#/words" data-r="words">🃏 Слова (Anki)</a>
    <a href="#/duo" data-r="duo">🦉 Фразы</a>
    <a href="#/listen" data-r="listen">🎧 Слушание</a>
    <a href="#/read" data-r="read">📖 Чтение</a>
    <a href="#/speak" data-r="speak">🗣️ Говорение</a>
    <a href="#/write" data-r="write">✍️ Письмо</a>
    <a href="#/work" data-r="work">💼 Рабочий английский</a>
    <a href="#/errors" data-r="errors">🐞 Мои ошибки</a>
    <a href="#/progress" data-r="progress">📊 Прогресс и часы</a>
    <a href="#/resources" data-r="resources">💡 Как учиться</a>

    <a href="#/settings" data-r="settings">⚙️ Настройки</a>
  </nav>
  <main id="app" class="main"></main>
</div>

<button class="fab" id="fab" title="AI-репетитор Мия"></button>
<aside class="helper hide" id="helper">
  <div class="helper-head">
    <div class="tutor-card" style="background:none;padding:0;flex:1;min-width:0">
      <span id="helperAva"></span>
      <div class="who" style="min-width:0"><b>Мия · AI-репетитор</b><span class="live">онлайн</span> <span class="muted small" id="helperCtx"></span></div>
    </div>
    <button class="icon-btn" id="helperClose">✕</button>
  </div>
  <div class="helper-body" id="helperBody"></div>
  <form class="helper-form" id="helperForm">
    <textarea id="helperInput" rows="2" placeholder="Спросите что угодно: «почему тут the?», «объясни проще», «дай ещё примеров»…"></textarea>
    <button class="btn primary" type="submit">➤</button>
  </form>
</aside>
<div class="toast hide" id="toast"></div>
<script type="module" src="js/app.js?v=20261026a"></script>
